                <div style="display:flex;align-items:center;gap:12px;">
                  <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text-muted);cursor:pointer;user-select:none;">
                    <input type="checkbox" id="ideCustomToggle" ${c.customTestActive ? 'checked' : ''} style="cursor:pointer;" />
                    Custom Testcase
                  </label>

                  ${qResults ? `
                    <div class="ide-diag-badge">
                      <span>Time: <strong>${qResults.runtime || '0.02s'}</strong></span>
                      <span>|</span>
                      <span>Memory: <strong>${qResults.memory || '12.4 MB'}</strong></span>
                    </div>
                  ` : ''}
                </div>
              </div>

              <div class="ide-drawer-body" id="ideDrawerBody">
                ${renderDrawerContent(q, qResults, activeTab, c.drawerTab, c.customTestActive)}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  wireIdeEvents(q, qIndex);
}

function renderDrawerContent(q, qResults, activeTab, drawerTab, customTestActive) {
  if (customTestActive) {
    return `
      <div>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;font-family:'Inter',sans-serif;font-weight:600;">
          Custom Input Parameters (JSON/text matching function arguments):
        </div>
        <textarea id="ideCustomInputArea" class="ide-custom-input" placeholder="e.g. [2, 7, 11, 15], 9">${esc(state.codingAssessment.customInput || '')}</textarea>
        <div style="font-size:0.72rem;color:var(--text-faint);margin-top:6px;font-family:'Inter',sans-serif;">
          Click "Run" or "Verify" to execute your custom testcase.
        </div>
      </div>
    `;
  }

  if (drawerTab === 'debug') {
    if (!qResults) {
      return `
        <div style="color:var(--text-muted);font-size:0.8rem;font-family:'Inter',sans-serif;">
          No execution logs yet. Click <strong>Run</strong> or <strong>Verify</strong> to view runtime output and diagnostics.
        </div>
      `;
    }
    const currentRes = qResults.results[activeTab] || qResults.results[0];
    return `
      <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;">
        <div style="color:var(--text-muted);margin-bottom:6px;">--- COMPILER & RUNTIME DIAGNOSTICS ---</div>
        <div style="color:var(--text-main);">Process exited with status 0 (Execution Time: ${qResults.runtime}, Memory: ${qResults.memory})</div>
        ${currentRes && currentRes.error ? `
          <div style="color:#DC2626;margin-top:8px;white-space:pre-wrap;">${esc(currentRes.error)}</div>
        ` : `
          <div style="color:#059669;margin-top:8px;">Standard Output: Clean execution. No runtime warnings or memory leaks detected.</div>
        `}
      </div>
    `;
  }

  if (drawerTab === 'testresult') {
    if (!qResults) {
      return `
        <div style="color:var(--text-muted);font-size:0.8rem;font-family:'Inter',sans-serif;">
          No test results available yet. Run or verify your solution to see test evaluation results.
        </div>
      `;
    }
    const res = qResults.results[activeTab] || qResults.results[0];
    if (res.error) {
      return `
        <div class="ide-clean-card error">
          <div style="color:#D97706;font-weight:700;font-size:0.82rem;margin-bottom:6px;display:flex;align-items:center;gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Runtime / Compilation Error
          </div>
          <pre style="margin:0;color:#DC2626;white-space:pre-wrap;font-size:0.78rem;line-height:1.45;">${esc(res.error)}</pre>
        </div>
      `;
    }

    if (res.passed) {
      return `
        <div class="ide-clean-card passed">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <span style="color:#059669;font-weight:700;font-size:0.82rem;display:inline-flex;align-items:center;gap:5px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              Passed — Output Matched
            </span>
            <span style="font-size:0.72rem;color:var(--text-muted);font-family:'Inter',sans-serif;">Status: Accepted</span>
          </div>

          ${res.hidden ? `
            <div style="color:#059669;font-size:0.8rem;font-family:'Inter',sans-serif;">
              Hidden Test Case verified successfully. Boundary conditions, scale limits, and expected performance verified.
            </div>
          ` : `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;">
              <div>
                <span style="color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;">Expected Output:</span>
                <div style="color:#059669;font-weight:600;margin-top:2px;">${esc(JSON.stringify(res.expected))}</div>
              </div>
              <div>
                <span style="color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;">Actual Output:</span>
                <div style="color:#059669;font-weight:600;margin-top:2px;">${esc(JSON.stringify(res.actual))}</div>
              </div>
            </div>
          `}
        </div>
      `;
    }

    return `
      <div class="ide-clean-card failed">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="color:#DC2626;font-weight:700;font-size:0.82rem;display:inline-flex;align-items:center;gap:5px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Wrong Answer — Output Mismatch
          </span>
          <span style="font-size:0.72rem;color:var(--text-muted);font-family:'Inter',sans-serif;">Status: Failed</span>
        </div>

        ${res.hidden ? `
          <div style="color:#DC2626;font-size:0.8rem;font-family:'Inter',sans-serif;">
            Failed on Hidden Edge Case. Verify constraint bounds, edge inputs, empty collections, and zero values.
          </div>
        ` : `
          <div style="margin-bottom:6px;">
            <span style="color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;">Input:</span>
            <div style="color:var(--text-main);font-weight:600;margin-top:2px;">${esc(res.input)}</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;">
            <div>
              <span style="color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;">Expected Output:</span>
              <div style="color:#059669;font-weight:600;margin-top:2px;">${esc(JSON.stringify(res.expected))}</div>
            </div>
            <div>
              <span style="color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;">Actual Output:</span>
              <div style="color:#DC2626;font-weight:600;margin-top:2px;">${esc(JSON.stringify(res.actual))}</div>
            </div>
          </div>
        `}
      </div>
    `;
  }

  // Default: 'testcase'
  const tc = q.testCases[activeTab] || q.testCases[0];
  return `
    <div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
        ${[0, 1, 2].map(idx => {
          const isHidden = idx === 2;
          let dotClass = 'pending';
          if (qResults && qResults.results[idx]) {
            dotClass = qResults.results[idx].passed ? 'pass' : 'fail';
          }
          return `
            <button class="ide-dtab-btn ${activeTab === idx ? 'active' : ''}" data-tab-idx="${idx}" type="button">
              <span class="ide-dot ${dotClass}"></span>
              ${isHidden ? 'Hidden Case 3' : `Case ${idx + 1}`}
            </button>
          `;
        }).join('')}
      </div>

      <div class="ide-clean-card">
        <div style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:4px;">
          Input ${tc.hidden ? '(Hidden Verification Edge Case)' : ''}
        </div>
        <div style="color:var(--text-main);">${esc(tc.input)}</div>
        ${!tc.hidden ? `
          <div style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-top:8px;margin-bottom:4px;">
            Expected Output
          </div>
          <div style="color:#059669;font-weight:600;">${esc(JSON.stringify(tc.expected))}</div>
        ` : ''}
      </div>
    </div>
  `;
}

function wireIdeEvents(q, qIndex) {
  const c = state.codingAssessment;
  const ta = document.getElementById('ideCodeTextarea');
  const gutter = document.getElementById('ideLineNumbers');
  const cursorPosEl = document.getElementById('ideCursorPos');

  function updateGutterAndPos() {
    if (!ta) return;
    const val = ta.value;
    const lines = val.split('\n').length || 1;
    if (gutter) {
      gutter.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
    }
    if (cursorPosEl) {
      const pos = ta.selectionStart || 0;
      const sub = val.substring(0, pos);
      const curLine = (sub.match(/\n/g) || []).length + 1;
      const lastNl = sub.lastIndexOf('\n');
      const curCol = lastNl === -1 ? pos + 1 : pos - lastNl;
      cursorPosEl.textContent = `Ln ${curLine}, Col ${curCol} | Auto-saved`;
    }
  }

  updateGutterAndPos();

  if (ta) {
    ta.oninput = () => {
      c.answers[q.id] = ta.value;
      updateGutterAndPos();
    };

    ta.onkeyup = () => updateGutterAndPos();
    ta.onclick = () => updateGutterAndPos();

    ta.onscroll = () => {
      if (gutter) gutter.scrollTop = ta.scrollTop;
    };

    ta.onkeydown = (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 4;
        c.answers[q.id] = ta.value;
        updateGutterAndPos();
      }
    };
  }

  // Theme Toggle Button
  const themeBtn = document.getElementById('ideThemeToggleBtn');
  if (themeBtn) {
    themeBtn.onclick = () => toggleIdeTheme();
  }

  // Question Selector Buttons in Rail
  document.querySelectorAll('.ide-q-btn[data-qid-index]').forEach(btn => {
    btn.onclick = () => {
      if (ta) c.answers[q.id] = ta.value;
      c.activeQIndex = parseInt(btn.dataset.qidIndex, 10);
      c.activeTab = 0;
      render();
    };
  });

  // Next Question Button
  const nextQBtn = document.getElementById('ideNextQBtn');
  if (nextQBtn) {
    nextQBtn.onclick = () => {
      if (ta) c.answers[q.id] = ta.value;
      c.activeQIndex = (qIndex + 1) % c.questions.length;
      c.activeTab = 0;
      render();
    };
  }

  // Language Dropdown Switcher
  const langSelect = document.getElementById('ideLangSelect');
  if (langSelect) {
    langSelect.onchange = () => {
      const newLang = langSelect.value;
      if (newLang !== c.language) {
        if (confirm(`Switch programming track to ${newLang}? Your code for each problem will load the ${newLang} boilerplate template.`)) {
          c.language = newLang;
          c.questions = pickCodingQuestions(currentStudent(), newLang);
          c.answers = {};
          c.questions.forEach(qItem => { c.answers[qItem.id] = qItem.boilerplate; });
          c.testResults = {};
          c.activeQIndex = 0;
          c.activeTab = 0;
          render();
        } else {
          langSelect.value = c.language;
        }
      }
    };
  }

  // Reset Template Boilerplate
  const resetBtn = document.getElementById('ideResetBtn');
  if (resetBtn) {
    resetBtn.onclick = () => {
      if (confirm('Reset code to default problem boilerplate? Current edits will be replaced.')) {
        c.answers[q.id] = q.boilerplate;
        if (ta) {
          ta.value = q.boilerplate;
          updateGutterAndPos();
        }
      }
    };
  }

  // Drawer Tabs (Test Case / Test Result / Debug Code)
  document.querySelectorAll('.ide-dtab-btn[data-dtab]').forEach(btn => {
    btn.onclick = () => {
      c.drawerTab = btn.dataset.dtab;
      document.querySelectorAll('.ide-dtab-btn[data-dtab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const drawerBody = document.getElementById('ideDrawerBody');
      if (drawerBody) {
        drawerBody.innerHTML = renderDrawerContent(q, c.testResults[q.id], c.activeTab, c.drawerTab, c.customTestActive);
        wireDrawerTestcaseTabs(q);
      }
    };
  });

  // Custom Testcase Toggle
  const customToggle = document.getElementById('ideCustomToggle');
  if (customToggle) {
    customToggle.onchange = () => {
      c.customTestActive = customToggle.checked;
      const drawerBody = document.getElementById('ideDrawerBody');
      if (drawerBody) {
        drawerBody.innerHTML = renderDrawerContent(q, c.testResults[q.id], c.activeTab, c.drawerTab, c.customTestActive);
        wireDrawerTestcaseTabs(q);
      }
    };
  }

  function wireDrawerTestcaseTabs(currQ) {
    document.querySelectorAll('#ideDrawerBody .ide-dtab-btn[data-tab-idx]').forEach(btn => {
      btn.onclick = () => {
        c.activeTab = parseInt(btn.dataset.tabIdx, 10);
        const drawerBody = document.getElementById('ideDrawerBody');
        if (drawerBody) {
          drawerBody.innerHTML = renderDrawerContent(currQ, c.testResults[currQ.id], c.activeTab, c.drawerTab, c.customTestActive);
          wireDrawerTestcaseTabs(currQ);
        }
      };
    });

    const customInputArea = document.getElementById('ideCustomInputArea');
    if (customInputArea) {
      customInputArea.oninput = () => {
        c.customInput = customInputArea.value;
      };
    }
  }

  wireDrawerTestcaseTabs(q);

  // Run Code (Public Cases)
  const runBtn = document.getElementById('ideRunBtn');
  if (runBtn) {
    runBtn.onclick = () => runInteractiveCode(false, true);
  }

  // Verify Code (All Cases including Hidden)
  const verifyBtn = document.getElementById('ideVerifyBtn');
  if (verifyBtn) {
    verifyBtn.onclick = () => runInteractiveCode(false, false);
  }

  // Submit Question Solution
  const submitQBtn = document.getElementById('ideSubmitQBtn');
  if (submitQBtn) {
    submitQBtn.onclick = () => runInteractiveCode(true, false);
  }

  // End Test Action (Proctored Modal)
  const exitBtn = document.getElementById('ideExitBtn');
  if (exitBtn) {
    exitBtn.onclick = () => confirmEndTest();
  }
}

function confirmEndTest() {
  const c = state.codingAssessment;
  let confirmModal = document.getElementById('ideConfirmExitModal');
  if (!confirmModal) {
    confirmModal = document.createElement('div');
    confirmModal.id = 'ideConfirmExitModal';
    confirmModal.className = 'ide-confirm-modal-backdrop';
    document.body.appendChild(confirmModal);
  }

  const solvedCount = c.questions.filter(item => item.status === 'passed').length;

  confirmModal.innerHTML = `
    <div class="ide-confirm-modal">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3 style="margin:0;font-size:1.15rem;font-weight:800;color:var(--text-main);">Conclude Coding Examination?</h3>
      </div>
      <p style="font-size:0.86rem;color:var(--text-muted);line-height:1.5;margin:0 0 16px;">
        You have solved <strong>${solvedCount} of 10</strong> problems. Ending the test will finalize your submission and apply your benchmarked marks to your Skill-Gap Telemetry.
      </p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="ideModalCancelExit" style="background:var(--bg-subtle);border:1px solid var(--border-color);color:var(--text-main);padding:8px 16px;border-radius:6px;font-size:0.82rem;font-weight:600;cursor:pointer;">
          Resume Assessment
        </button>
        <button id="ideModalConfirmExit" style="background:#EF4444;border:none;color:#FFFFFF;padding:8px 18px;border-radius:6px;font-size:0.82rem;font-weight:600;cursor:pointer;">
          Submit &amp; End Assessment
        </button>
      </div>
    </div>
  `;

  document.getElementById('ideModalCancelExit').onclick = () => confirmModal.remove();
  document.getElementById('ideModalConfirmExit').onclick = () => {
    confirmModal.remove();
    submitCodingAssessment();
  };
}

function runInteractiveCode(isSubmit, runOnlyPublic) {
  const c = state.codingAssessment;
  const qIndex = c.activeQIndex || 0;
  const q = c.questions[qIndex];
  const ta = document.getElementById('ideCodeTextarea');
  const code = ta ? ta.value : (c.answers[q.id] || q.boilerplate);
  c.answers[q.id] = code;

  const drawerBody = document.getElementById('ideDrawerBody');
  const statusNotice = document.getElementById('ideStatusNotice');

  c.drawerTab = 'testresult';

  if (drawerBody) {
    drawerBody.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;color:var(--text-muted);padding:14px 0;font-family:'Inter',sans-serif;">
        <span class="spinner" style="border-top-color:var(--accent-blue);width:16px;height:16px;"></span>
        <span>Compiling and verifying code against test suite...</span>
      </div>
    `;
  }
  if (statusNotice) {
    statusNotice.innerHTML = `<span style="color:var(--accent-blue);">Compiling solution...</span>`;
  }

  // Realistic 300ms compiler sandbox execution
  setTimeout(() => {
    const casesToRun = runOnlyPublic ? q.testCases.slice(0, 2) : q.testCases;
    const results = casesToRun.map(tc => executeSingleTestCase(code, c.language, q, tc));
    const allPassed = results.every(r => r.passed);
    const passedCount = results.filter(r => r.passed).length;

    if (!runOnlyPublic || isSubmit) {
      q.status = allPassed ? 'passed' : 'attempted';
      q.pointsEarned = allPassed ? 10 : 0;
      q.passedCasesCount = passedCount;
    }

    c.testResults[q.id] = {
      results,
      allPassed,
      runtime: results[0].runtime || '0.02s',
      memory: results[0].memory || '12.4 MB'
    };

    const failIdx = results.findIndex(r => !r.passed);
    if (failIdx !== -1) {
      c.activeTab = failIdx;
    }

    render();
  }, 320);
}

function startCodingTimer() {
  const c = state.codingAssessment;
  clearInterval(c.timerHandle);
  c.timerHandle = setInterval(() => {
    const elapsed = Math.floor((Date.now() - c.startTime) / 1000);
    c.remaining = Math.max(0, c.duration - elapsed);
    const badge = document.getElementById('ideTimerBadge');
    const timeText = document.getElementById('ideTimeText');
    if (badge && timeText) {
      timeText.textContent = fmtTimeLong(c.remaining);
      badge.className = 'ide-timer-pill ' + (c.remaining <= 60 ? 'warning-red' : (c.remaining <= 300 ? 'warning-amber' : ''));
    }
    if (c.remaining <= 0) {
      clearInterval(c.timerHandle);
      submitCodingAssessment();
    }
  }, 1000);
}

function submitCodingAssessment() {
  const c = state.codingAssessment;
  clearInterval(c.timerHandle);
  unlockAssessment();

  // Evaluate any un-run questions
  c.questions.forEach(q => {
    if (!c.testResults[q.id] && (!q.status || q.status === 'unattempted')) {
      const code = c.answers[q.id] || q.boilerplate;
      const results = q.testCases.map(tc => executeSingleTestCase(code, c.language, q, tc));
      const allPassed = results.every(r => r.passed);
      q.status = allPassed ? 'passed' : 'attempted';
      q.pointsEarned = allPassed ? 10 : 0;
      q.passedCasesCount = results.filter(r => r.passed).length;
      c.testResults[q.id] = { results, allPassed, runtime: '0.02s', memory: '12.4 MB' };
    }
  });

  const passedCount = c.questions.filter(q => q.status === 'passed').length;
  const finalPercentage = Math.round((passedCount / c.questions.length) * 100);
  const totalPassedCases = c.questions.reduce((sum, q) => sum + (q.passedCasesCount || 0), 0);

  const s = currentStudent();
  if (s) {
    if (!s.coding) s.coding = {};
    s.coding[c.language] = {
      percentage: finalPercentage,
      passedQuestions: passedCount,
      totalQuestions: 10,
      passedCases: totalPassedCases,
      totalCases: 30,
      completedAt: new Date().toLocaleDateString()
    };

    refreshStudentVerifiedSkills(s);

    try {
      localStorage.setItem('skillbridge_students', JSON.stringify(STUDENTS));
    } catch (e) {}

    fetch(`${API_BASE}/students/verify-skill`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentId: s.id,
        skill: c.language,
        mode: 'coding',
        language: c.language,
        percentage: finalPercentage,
        compositeScore: s.verified[c.language] || finalPercentage,
        questions: c.questions.map(q => ({ id: q.id, title: q.title, status: q.status, points: q.pointsEarned || 0 }))
      })
    }).catch(err => console.warn('Failed to persist coding verification:', err));
  }

  showCelebratoryModal(c.language, finalPercentage, passedCount, totalPassedCases);
}

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>

function wireApplyButtons(s){
  document.querySelectorAll('[data-apply-company]').forEach(btn=>{
    btn.onclick = ()=>{
      const appItem = {company:btn.dataset.applyCompany, role:btn.dataset.applyTitle, status:'applied', applied:new Date().toLocaleDateString()};
      s.internships.push(appItem);
      fetch(`${API_BASE}/students/apply`, {

        body: JSON.stringify({
          studentId: s.id,
          internship: appItem
        })

    };

}

    const weight = {};
    document.querySelectorAll('.reqSkill').forEach(cb=>{
      if(cb.checked){
        const sk = cb.dataset.skill;
        const level = document.querySelector(`.reqLevel[data-skill="${sk}"]`).value;
        weight[sk] = parseInt(level,10) || 60;
      }
    });
    if(Object.keys(weight).length===0){ document.getElementById('postMsg').textContent = "Select at least one required skill."; return; }
    const type = document.getElementById('roleType').value;
    const newRole = {id:'r'+(_nextRoleId++), title, type, weight};
    roles.push(newRole);

    fetch(`${API_BASE}/companies/roles`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: state.companyName,
        role: newRole
      })
    }).catch(err => console.warn('Failed to persist role to backend:', err));
    render();
  };
}

function renderIndustryMatched(main){
  const roles = COMPANIES[state.companyName] || [];
  if(!roles.length){
    main.innerHTML = `<div class="pagehead"><h1>Matched Candidates</h1><p>Post a role first to see ranked candidates.</p></div>`;
    return;
  }
  if(!roles.find(r=>r.id===state.activeCompanyRoleId)) state.activeCompanyRoleId = roles[0].id;
  const role = roles.find(r=>r.id===state.activeCompanyRoleId);

  main.innerHTML = `
    <div class="pagehead"><h1>Matched Candidates</h1><p>Every enrolled student, ranked against the role's required skills — using assessment-verified marks only. A skill the student hasn't been assessed on counts as a gap.</p></div>
    <div class="panel">
      <label class="signin-label">Role</label>
      <select id="rolePicker" style="width:100%;max-width:360px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;">
        ${roles.map(r=>`<option value="${r.id}" ${r.id===role.id?'selected':''}>${esc(r.title)}</option>`).join('')}
      </select>
      <div id="candidateList"></div>
    </div>
  `;
  document.getElementById('rolePicker').onchange = e=>{ state.activeCompanyRoleId = e.target.value; render(); };

  function fit(student){
    const entries = Object.entries(role.weight);
    let met=0; const gaps=[];
    entries.forEach(([sk,bar])=>{ if((student.verified[sk]??0)>=bar) met++; else gaps.push(sk); });
    return {score: Math.round((met/entries.length)*100), gaps};
  }
  const ranked = STUDENTS.map(s=>({student:s, ...fit(s)})).sort((a,b)=>b.score-a.score);
  document.getElementById('candidateList').innerHTML = ranked.map(r=>{
    const comm = r.student.assignments && r.student.assignments['Communication'];
    return `<div class="match-card" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <div><div class="role">${esc(r.student.name)}</div><div class="co">${esc(r.student.degree)} · CGPA ${r.student.cgpa}</div>
          ${r.gaps.length ? `<div style="font-size:11.5px;color:var(--rust);margin-top:4px;">Gaps: ${r.gaps.join(', ')}</div>` : `<div style="font-size:11.5px;color:var(--teal);margin-top:4px;">Meets every requirement</div>`}
        </div>
        <div class="match-score">${r.score}<span class="of">/100</span></div>
      </div>
      <div style="margin-top:8px;">
        ${comm ? `<button class="btn ghost" data-comm-toggle="${r.student.id}" style="font-size:11.5px;padding:5px 10px;">🎤 Communication: ${comm.percentage}% (${esc(comm.channel||'voice/typed')}) — view</button>
          <div id="comm-${r.student.id}" style="display:none;margin-top:8px;background:var(--cream-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;">
            ${(comm.prompts||[]).map((p,i)=>`<div style="margin-bottom:8px;"><div style="font-size:11.5px;font-weight:600;color:var(--ink-soft);">${esc(p)}</div><div style="font-size:12.5px;white-space:pre-wrap;">${esc((comm.transcripts||[])[i] || '(no answer captured)')}</div></div>`).join('')}
          </div>` : `<div style="font-size:11.5px;color:var(--ink-faint);">Communication not assessed yet</div>`}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-comm-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const panel = document.getElementById('comm-'+btn.dataset.commToggle);
      if(panel) panel.style.display = panel.style.display==='none' ? 'block' : 'none';
    };
  });
}

      ${mine.length ? mine.map(f=>`<div class="feedback-item"><div class="top"><span>${esc(f.date)}</span></div><p>${esc(f.text)}</p></div>`).join('') : '<p class="small-note">Nothing submitted yet.</p>'}
    </div>
  `;
  document.getElementById('fbSubmit').onclick = ()=>{
    const text = document.getElementById('fbText').value.trim();
    if(!text) return;
    const fbItem = {
      company: state.companyName,
      date: new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
      text
    };
    INDUSTRY_FEEDBACK.unshift(fbItem);
    fetch(`${API_BASE}/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fbItem)
    }).catch(err => console.warn('Failed to persist feedback to backend:', err));
    render();
  };
}

        <thead>
          <tr>
            <th>Program Title</th>
            <th>Partner Institution</th>
            <th>Corporate Sponsor</th>
            <th>Program Type</th>
            <th>Faculty Enrolled</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${HR_FACULTY_INITIATIVES.map(item => `
            <tr>
              <td><strong style="color:var(--slate-900);">${esc(item.title)}</strong></td>
              <td>${esc(item.institution)}</td>
              <td><span style="font-weight:600;color:var(--primary);">${esc(item.sponsor)}</span></td>
              <td><span class="company-badge" style="font-size:11px;padding:2px 8px;">${esc(item.type)}</span></td>
              <td><span style="font-family:var(--font-mono);font-weight:600;">${item.enrolled}</span></td>
              <td><span class="obs-card-badge ${item.statusClass}">${esc(item.status)}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================ COLLEGE PAGES ============================ */
function renderCollegeReadiness(main){
  const cohort = STUDENTS.map(s=>({name:s.name, readiness:placementScore(s)}));
  const high = cohort.filter(c=>c.readiness>=80).length;
  const med = cohort.filter(c=>c.readiness>=55 && c.readiness<80).length;
  const low = cohort.filter(c=>c.readiness<55).length;
  const applicationsLogged = STUDENTS.reduce((n,s)=>n+s.internships.length,0);
  const selectedCompleted = STUDENTS.reduce((n,s)=>n+s.internships.filter(i=>["selected","completed"].includes(i.status)).length,0);
  const activePostings = allRoles().length;
  const maxCount = Math.max(high,med,low,1);

  main.innerHTML = `
    <div class="pagehead"><h1>Placement Readiness Overview</h1><p>Cohort-wide view across all students on the portal — computed only from completed Skill Assessments, so an un-assessed skill counts as 0.</p></div>
    <div class="summary-card">
      <div class="summary-top"><span class="big">${STUDENTS.length}</span><span style="color:var(--ink-soft);">students profiled</span></div>
      <div class="summary-sub">
        <div><div class="n">${applicationsLogged}</div><div class="l">applications logged</div></div>
        <div><div class="n">${selectedCompleted}</div><div class="l">selected / completed</div></div>
        <div><div class="n">${activePostings}</div><div class="l">active postings</div></div>
      </div>
    </div>
    <div class="panel" style="margin-top:18px;">
      <h2>Readiness distribution</h2>
      <div class="dist-row"><div>High</div><div class="dist-track"><div class="dist-fill" style="width:${high/maxCount*100}%;background:var(--teal);"></div></div><div>${high}</div></div>
      <div class="dist-row"><div>Medium</div><div class="dist-track"><div class="dist-fill" style="width:${med/maxCount*100}%;background:var(--amber);"></div></div><div>${med}</div></div>
      <div class="dist-row"><div>Low</div><div class="dist-track"><div class="dist-fill" style="width:${low/maxCount*100}%;background:var(--rust);"></div></div><div>${low}</div></div>
    </div>
  `;
}

function renderCollegeAnalytics(main){
  const cohort = STUDENTS.map(s=>({name:s.name, readiness:placementScore(s)})).sort((a,b)=>b.readiness-a.readiness);
  main.innerHTML = `
    <div class="pagehead"><h1>Student Skill Analytics</h1><p>Placement readiness per student, estimated from assessment-verified skills, CGPA and internship history.</p></div>
    <div class="panel">
      <table><thead><tr><th>Student</th><th>Readiness</th><th>Status</th></tr></thead><tbody>
        ${cohort.map(s=>`<tr><td>${esc(s.name)}</td>
          <td style="width:170px;"><div class="track" style="width:120px;display:inline-block;vertical-align:middle;"><div class="fill" style="width:${s.readiness}%;background:${s.readiness>=80?'var(--teal)':s.readiness<55?'var(--rust)':'var(--amber)'}"></div></div><span style="margin-left:8px;color:var(--ink-soft);">${s.readiness}</span></td>
          <td><span class="pill ${readinessPillClass(readinessStatus(s.readiness))}">${readinessStatus(s.readiness)}</span></td></tr>`).join('')}
      </tbody></table>
    </div>
  `;
}

function renderCollegeStrength(main){
  const cohortSkills = {};
  SKILL_NAMES.forEach(sk=>{
    const vals = STUDENTS.map(s=>s.verified[sk] ?? 0);
    cohortSkills[sk] = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  });
  main.innerHTML = `
    <div class="pagehead"><h1>Skill Strength Map</h1><p>Average of assessment-verified scores across all tracked students — an unassessed skill counts as 0 until tested.</p></div>
    <div class="panel">${skillRows(cohortSkills)}</div>
  `;
}

function renderCollegeFeedback(main){
  main.innerHTML = `
    <div class="pagehead"><h1>Industry Feedback</h1><p>Recent feedback from hiring partners — use this to prioritise curriculum focus for next term.</p></div>
    <div class="panel">
      ${INDUSTRY_FEEDBACK.map(f=>`<div class="feedback-item"><div class="top"><strong style="color:var(--ink);">${esc(f.company)}</strong><span>${esc(f.date)}</span></div><p>${esc(f.text)}</p></div>`).join('')}
    </div>
  `;
}

function renderCollegeFaculty(main){
  const facultyPrograms = PROGRAMS.filter(p=>p.audience==='faculty');
  const facultyApps = PROGRAM_APPLICATIONS.filter(a=>a.applicantType==='faculty');
  const byType = {};
  facultyPrograms.forEach(p=>{ byType[p.type] = (byType[p.type]||0)+1; });

  main.innerHTML = `
    <div class="pagehead"><h1>Faculty & Collaboration</h1><p>Institution-side visibility into industry-published FDPs, industrial training, consultancy/research opportunities, and how many faculty have engaged.</p></div>
    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-num">${facultyPrograms.length}</div><div class="stat-lbl">Faculty-facing programs published</div></div>
      <div class="stat-card"><div class="stat-num">${facultyApps.length}</div><div class="stat-lbl">Faculty applications / enrollments</div></div>
      <div class="stat-card"><div class="stat-num">${new Set(facultyApps.map(a=>a.applicantName)).size}</div><div class="stat-lbl">Distinct faculty engaged</div></div>
    </div>
    <div class="panel">
      <h2>By type</h2>
      ${Object.keys(byType).length ? Object.entries(byType).map(([type,count])=>`<div class="skillrow"><div class="name">${esc(type)}</div><div class="track"><div class="fill" style="width:${Math.min(count*20,100)}%;background:var(--purple);"></div></div><div class="pct">${count}</div></div>`).join('') : '<p class="small-note">No faculty-facing programs published by industry yet.</p>'}
    </div>
    <div class="panel" style="margin-top:18px;">
      <h2>All faculty-facing programs</h2>
      ${facultyPrograms.length ? facultyPrograms.map(p=>{
        const enrolled = PROGRAM_APPLICATIONS.filter(a=>a.programId===p.id);
        return `<div class="match-card"><div>
          <div class="role">${esc(p.title)} <span class="company-badge">${esc(p.type)}</span></div>
          <div class="co">${esc(p.company)} · ${esc(p.duration)}</div>
          ${enrolled.length ? `<div style="font-size:11.5px;color:var(--teal);margin-top:4px;">${enrolled.length} faculty engaged</div>` : ''}
        </div></div>`;
      }).join('') : '<p class="small-note">Nothing published yet.</p>'}
    </div>
  `;
}

function renderCollegeResumes(main){
  const withDoc = STUDENTS.filter(s=>s.resumeUrl).length;
  main.innerHTML = `
    <div class="pagehead"><h1>Resumes</h1><p>Every student, matched to the document they were scanned from — the same secure document store also holds certificates, internship reports and other academic records.</p></div>
    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-num">${withDoc}</div><div class="stat-lbl">Students with a document on file</div></div>
      <div class="stat-card"><div class="stat-num">${STUDENTS.length-withDoc}</div><div class="stat-lbl">Students with no document uploaded</div></div>
      <div class="stat-card"><div class="stat-num">${STUDENTS.length}</div><div class="stat-lbl">Total students tracked</div></div>
    </div>
    <div class="panel">
      <table><thead><tr><th>Student</th><th>Degree</th><th>Document</th></tr></thead><tbody>
        ${STUDENTS.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.degree||'—')}</td>
          <td>${s.resumeUrl?`<a href="${s.resumeUrl}" target="_blank" style="color:var(--teal);text-decoration:none;font-weight:600;">📄 ${esc(s.resumeFile.name)}</a>`:'<span style="color:var(--ink-faint);">No document uploaded</span>'}</td></tr>`).join('')}
      </tbody></table>
    </div>
  `;
}

/* ============================ ACADEMICIAN PAGES ============================ */
function renderAcademicianPrograms(main){
  const available = PROGRAMS.filter(p=>p.audience==='faculty');
  main.innerHTML = `
    <div class="pagehead"><h1>FDP & Collaboration</h1><p>Faculty Development Programs, industrial training, consultancy/research opportunities, and industry collaboration — mentorship, workshops, guest lectures and live projects — all published directly by industry partners.</p></div>
    <div id="progList">${available.map(p=>renderProgramCard(p, 'faculty', state.academicianName, state.academicianName)).join('') || '<p class="small-note">No programs published yet — check back once an industry partner posts one.</p>'}</div>
  `;
  wireProgramButtons();
}

function renderAcademicianApplications(main){
  const mine = PROGRAM_APPLICATIONS.filter(a=>a.applicantType==='faculty' && a.applicantId===state.academicianName);
  main.innerHTML = `
    <div class="pagehead"><h1>My Applications</h1><p>Every FDP, training or collaboration program ${esc(state.academicianName)} has applied to.</p></div>
    <div class="panel">
      ${mine.length ? mine.map(a=>{
        const p = PROGRAMS.find(pp=>pp.id===a.programId);
        return `<div class="feedback-item"><div class="top"><strong style="color:var(--ink);">${esc(p?p.title:'(removed program)')}</strong><span>${esc(a.appliedAt)}</span></div><p>${p?esc(p.company)+' · '+esc(p.type):''} — <span class="pill ${a.status==='applied'?'applied':'selected'}">${a.status}</span></p></div>`;
      }).join('') : '<p class="small-note">No applications yet — browse FDP & Collaboration to get started.</p>'}
    </div>
  `;
}

/* ============================ ROUTER ============================ */
function render(){
  if(state.view==='landing') return renderLanding();
  if(state.view==='signin') return renderSignin();
  // Navigation guard: if somehow on app view without a role, redirect to landing
  if(!state.role){
    state.view = 'landing';
    return renderLanding();
  }
  renderShell();
}
STUDENTS.forEach(s => refreshStudentVerifiedSkills(s));
render();
initBackendData();
</script>
</body>
</html>
